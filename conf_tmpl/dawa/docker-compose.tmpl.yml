name: dawa

services:
  dawa:
    image: dawa
    container_name: dawa
    ports:
      - "8080:{{ .PortOut }}"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_LEVEL=debug
      - DEMO=true
      - DOCKER_URL=http://docker-proxy:2375
      - PUBLIC_PROTOCOL=http
      - SITE_TITLE
      - SITE_DOMAIN
      - SECRET_KEY_BASE
      - SALT
      - OPENID_PRIVATE_KEY
    volumes:
      - dawa_storage:/rails/storage
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1GB

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - DELETE=1
      - INFO=1
      - VERSION=1
      - LISTEN=0.0.0.0:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
      - /run
    group_add:
      - "${DOCKER_GID}"

volumes:
  dawa_storage:

