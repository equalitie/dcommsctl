volumes:
  peertube_data:
  peertube_config:
  peertube_db:
  peertube_redis:

networks:
  peertube-int:
  peertube:
    internal: true
  proxy:
    external: true

services:
  peertube-back:
    image: chocobozzz/peertube:production-bookworm
    env_file: ./.env
    ports:
      - "127.0.0.1:${PORT_RMTP}:1935"
      - "127.0.0.1:${PORT_WEB_UI}:9000"
    volumes:
      # Remove the following line if you want to use another webserver/proxy or test PeerTube in local
      # - assets:/app/client/dist
      - peertube_data:/data
      - peertube_config:/config
    depends_on:
      peertube-postgres:
        condition: service_healthy
      peertube-redis:
        condition: service_started
    networks:
      proxy:
          aliases:
              - {{ .InstanceID }}
      peertube-int: {}
      peertube: {}
    restart: "always"

    labels:
      dc_app: peertube
      dc_name: peertube-back
      dc_version: "{{ .Version }}"
      dc_inst: "{{ .InstanceID }}"

  peertube-postgres:
    image: postgres:13-alpine
    env_file: ./.env
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    # Over TCP: the first-run init server listens on the socket only, so it does not count as ready.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - peertube_db:/var/lib/postgresql/data
    networks:
      - peertube-int
    restart: "always"
    labels:
      dc_app: peertube
      dc_name: peertube-postgres
      dc_version: "{{ .Version }}"
      dc_inst: "{{ .InstanceID }}"

  peertube-redis:
    image: redis:6-alpine
    volumes:
      - peertube_redis:/data
    networks:
      - peertube-int
    restart: "always"
    labels:
      dc_app: peertube
      dc_name: peertube-redis
      dc_version: "{{ .Version }}"
      dc_inst: "{{ .InstanceID }}"

