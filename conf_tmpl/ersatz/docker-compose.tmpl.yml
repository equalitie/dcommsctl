services:
  ersatz:
    image: registry.dcomms.org/dcomms/ersatz:latest
    container_name: "{{ .InstanceID }}-ersatz"
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - ./ersatz.yml:/etc/ersatz.yml:ro
    networks:
      proxy:
        aliases:
          - {{ .InstanceID }}
    environment:
      - ERSATZ_DUMMY_LOG_FREQUENCY
      - ERSATZ_DUMMY_CPU_LOAD
      - ERSATZ_IMG_PATH
      - ERSATZ_BG_COLOR
      - ERSATZ_MESSAGE
    healthcheck:
      test: ["CMD", "/usr/local/bin/ersatz", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    labels:
      dc_app: ersatz
      dc_name: ersatz
      dc_version: 0.0.1
      dc_inst: "{{ .InstanceID }}"

networks:
  proxy:
    external: true
