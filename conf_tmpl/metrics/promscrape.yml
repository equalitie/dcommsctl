#
# victoriametrics configuration file
# some metrics are pushed to victoriametrics via vector.
# this file configures the exporters pulled by victoriametrics
#

global:
  scrape_interval: 60s
  scrape_timeout: 2s

scrape_configs:
  - job_name: docker_exporter
    static_configs:
      - targets: ["logporter:9333"]
    honor_labels: true
