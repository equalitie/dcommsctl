networks:
  proxy:
    external: true
volumes:
  caddy_data:
  caddy_config:
services:
  caddy:
    image: caddy:2.10.2
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: bind
        source: ./www
        target: /www
    networks:
      - proxy
    ports:
      - target: 80
        published: {{ .Port }}
        protocol: tcp
      - target: 443
        published: 3443
        protocol: tcp
      - target: 8448
        published: 8448
        protocol: tcp
      - target: 2019
        published: 2019
        protocol: tcp
        host_ip: "127.0.0.1"
    configs:
      - source: caddy-caddyfile-config
        target: /etc/caddy/Caddyfile

configs:
  caddy-caddyfile-config:
    file: Caddyfile
    external: false
