networks:
  caddy:
  metrics:
    internal: true
  dawa:
    internal: true
  mastodon:
    internal: true
  mastodon_outbound:
  synapse:
    internal: true
  synapse_outbound:
  element:
    internal: true
  peertube:
    internal: true
volumes:
  caddy_data:
  caddy_config:
services:

  # caddy acts as a reverse proxy for synapse (matrix)
  caddy:
    image: caddy:2.10.2
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: bind
        source: ./www
        target: /www
    networks:
      - caddy
      - dawa
      - mastodon
      - synapse
      - element
      - peertube
    ports:
      - target: 80
        published: {{ .Port }}
        protocol: tcp
        mode: host
      - target: 443
        published: 3443
        protocol: tcp
        mode: host
      - target: 8448
        published: 8448
        protocol: tcp
        mode: host
      - target: 2019
        published: 2019
        protocol: tcp
        mode: host
    configs:
      - source: caddy-caddyfile-config
        target: /etc/caddy/Caddyfile

configs:
  caddy-caddyfile-config:
    file: Caddyfile
    external: false
