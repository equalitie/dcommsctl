networks:
  proxy:
    external: true
volumes:
  caddy_data:
  caddy_config:
services:
  caddy:
    image: caddy:2.10.2
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    # we are immediately calling Caddy API, so this healthcheck here is to make sure it's up
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:2019/config/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: bind
        source: ./www
        target: /www
    networks:
      - proxy
    ports:
      - target: 80
        published: "${PORT_HTTP}"
        protocol: tcp
      - target: 443
        published: "${PORT_HTTPS}"
        protocol: tcp
      - target: 8448
        published: 8448
        protocol: tcp
      - target: 2019
        published: 2019
        protocol: tcp
        host_ip: "127.0.0.1"
    configs:
      - source: caddy-caddyfile-config
        target: /etc/caddy/caddy.json

configs:
  caddy-caddyfile-config:
    file: caddy.json
    external: false
