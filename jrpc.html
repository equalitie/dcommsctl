<html>

    <head>

    </head>

    <body>
        <script>
            const ws = new WebSocket('ws://localhost:8080/ws');

            let instanceId = null;

            ws.onopen = () => {
              document.getElementById('result').textContent = 'connected';
            };

            ws.onmessage = (event) => {
              const data = JSON.parse(event.data);

                if (data.result.id) {
                    instanceId = data.result.id;
                }

              document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            };

            ws.onerror = (err) => {
              document.getElementById('result').textContent = err;
            };

            function sendInstall() {
              ws.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'inst/install',
                params: { name: "peertube" },
                id: 1
              }));
            }
            function sendUninstall() {
              ws.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'inst/uninstall',
                params: { name: "peertube" },
                id: 1
              }));
            }
            function sendStart() {
              ws.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'inst/start',
                params: { id: instanceId },
                id: 1
              }));
            }
            function sendStop() {
              ws.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'inst/stop',
                params: { id: instanceId },
                id: 1
              }));
            }

            function sendBackup() {
              ws.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'inst/backup',
                params: { id: instanceId },
                id: 1
              }));
            }
            function sendRestore() {
              ws.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'inst/restore',
                params: { id: instanceId },
                id: 1
              }));
            }

        </script>


        <div id="result"></div>

        <div>
            <button onClick="sendInstall()">Install</button>
            <button onClick="sendUninstall()">Uninstall</button>
            <button onClick="sendStart()">Start</button>
            <button onClick="sendStop()">Stop</button>
            <button onClick="sendBackup()">Backup</button>
            <button onClick="sendRestore()">Restore</button>
        </div>


    </body>

</html>
