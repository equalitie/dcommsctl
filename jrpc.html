<html>

    <head>

    </head>

    <body>

        <script>
            let reqID = 0;
            const ws = new WebSocket('ws://localhost:6006/ws');

            let dawaInstanceId = null;
            let pendingInstallApp = null;

            ws.onopen = () => {
                document.getElementById('result').textContent = 'connected';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.error) {

                } else {
                    if (data.result.id) {
                        document.getElementById("instance_id").value = data.result.id;
                    } 
                    if (data.result.job_id) {
                        document.getElementById("job_id").value = data.result.job_id;
                    }
                }

                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            };

            ws.onerror = (err) => {
                document.getElementById('result').textContent = err;
            };

            function send(method, params) {
                ws.send(JSON.stringify({
                    jsonrpc: '2.0',
                    method,
                    params,
                    id: ++reqID
                }));
            }
            function checkJobStatus() {
                const jobID = document.getElementById("job_id").value;

                send('job/status', { id: jobID });
            }

            function getJobLog() {
                const jobID = document.getElementById("job_id").value;

                send('job/log', { id: jobID });
            }

            function sendInstall(e) {
                console.log(e);
                const name = e.currentTarget.dataset.name;
                send('inst/install', { name, domain: `${name}.localhost` });
            }
            function sendUninstall() {
                send('inst/uninstall', { id: instanceId });
            }
            function sendStart() {
                send('inst/start', { id: instanceId });
            }
            function sendStop() {
                send('inst/stop', { id: instanceId });
            }

            function sendBackup() {
                send('inst/backup', { id: instanceId });
            }

            function sendRestore() {
                send('inst/restore', { id: instanceId });
            }


        </script>


        <div id="result"></div>

        <div>
            <button data-name="peertube" onclick="sendInstall(event)">Install Peertube</button>
            <button data-name="mastodon" onclick="sendInstall(event)">Install Mastodon</button>

            <div>
                <label>Instance ID</label>
                <input id="instance_id" type="text">
            </div>
            <div>
                <label>Job ID</label>
                <input id="job_id" type="text">

                <button onClick="checkJobStatus(event)">Check status</button>

                <div id="job_result"></div>
            </div>
        </div>
    </body>

</html>
