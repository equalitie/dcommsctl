# do not mind me, I'm temporary
services:
  dawa:
    image: dawa
    container_name: dawa
    ports:
      - "8080:8080"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_LEVEL=debug
      - DOCKER_URL=http://docker-proxy:2375
      - PUBLIC_PROTOCOL=http
    volumes:
      - dawa_storage:/rails/storage
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1GB
