<html>
  <head></head>
  <body>
    <script>
      let reqID = 0;
      const ws = new WebSocket('ws://localhost:6006/ws');

      let dawaInstanceId = null;
      let pendingInstallApp = null;

      ws.onopen = () => {
        document.getElementById('result').textContent = 'connected';

        setInterval(getAllJobs, 2000);
        setInterval(getAllInstances, 2000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.error) {

        } else {
          if (data.result.id) {
            document.getElementById("instance_id").value = data.result.id;
          }
          if (data.result.job_id) {
            document.getElementById("job_id").value = data.result.job_id;
          }

          if (data.result.log) {
            document.getElementById("job_log").innerText = data.result.log;
          }

          if (data.result.backups) {

            const s = document.getElementById("backup-id");

            let opt = '';

            for (const b of data.result.backups) {
              opt += `<option value=${b}>${b}</option>`;

            }
            s.innerHTML = opt;
          }

          if (data.result.jobs) {

            let html = '<table>';
            for (const jb of data.result.jobs) {
              html += `<tr><td>${jb.id}</td><td>${jb.type}</td><td>${jb.state}</td><td>${jb.exit_code}</td><td><button onclick="checkJobStatus('${jb.id}')">status</button><button onclick="checkJobLog('${jb.id}')">log</button></td></tr>`;
            }

            html += '</table>';

            document.getElementById('jobs').innerHTML = html;

          }
          if (data.result.instances) {
            let html = '<table>';
            for (const inst of data.result.instances) {
              html += `<tr><td>${inst.id}</td><td>${inst.app}</td><td><a href="https://${inst.domain}:3443">${inst.domain}</a></td><td>${inst.status}</td><td>${inst.version}</td><td><button onclick="sendStart('${inst.id}')">start</button><button onclick="sendStop('${inst.id}')">stop</button><button onclick="sendBackup('${inst.id}')">backup</button><button onclick="initRestore('${inst.id}')">mark for restore</button><button onclick="exposeInstance('${inst.id}')">expose</button></td></tr>`;
            }

            html += '</table>';

            document.getElementById('instances').innerHTML = html;
          }
        }

        if (!data.result.jobs && !data.result.instances) {
          document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        }
      };

      ws.onerror = (err) => {
        document.getElementById('result').textContent = err;
      };

      function send(method, params) {
        ws.send(JSON.stringify({
          jsonrpc: '2.0',
          method,
          params,
          id: ++reqID
        }));
      }

      function getAllJobs() {
        send('job/list');
      }

      function getAllInstances() {
        send('inst/list');
      }

      function checkJobStatus(jobID) {
        send('job/status', {
          id: jobID
        });
      }

      function checkJobLog(jobID) {
        send('job/log', {
          id: jobID
        });
      }

      function getJobLog() {
        const jobID = document.getElementById("job_id").value;

        send('job/log', {
          id: jobID
        });
      }

      function sendInstall(e) {
        console.log(e);
        const name = e.currentTarget.dataset.name;

        const domain = prompt(`Domain for the ${name} instance?`);
        send('inst/install', {
          name,
          domain,
        });
      }

      function sendUninstall() {
        send('inst/uninstall', {
          id: instanceId
        });
      }

      function sendStart(instanceId) {
        send('inst/start', {
          id: instanceId
        });
      }

      function sendStop(instanceId) {
        send('inst/stop', {
          id: instanceId
        });
      }

      function sendBackup(instanceId) {
        send('inst/backup', {
          id: instanceId
        });
      }

      function initRestore(instanceId) {
        document.getElementById("instance_id").value = instanceId;

      }

      function sendRestore(instanceId, backupId) {
        send('inst/restore', {
          instance_id: instanceId,
          backup_id: backupId
        });
      }

      function exposeInstance(instanceId) {
        send('inst/expose', {
          id: instanceId
        });
      }

      function getBackups(instanceId) {
        send('backup/list', {});
      }
    </script>
    <div>
      <div id="window-restore">
        <div>
          <label>Instance ID</label>
          <input id="instance_id" type="text">
        </div>
        <div>
          <button onClick="getBackups()">Get backups</button>
          <select id="backup-id" /></select>
      </div>
      <div>
        <button onClick="sendRestore(document.getElementById('instance_id').value, document.getElementById('backup-id').value)">Restore</button>
      </div>
    </div>
    <button data-name="peertube" onclick="sendInstall(event)">Install Peertube</button>
    <button data-name="mastodon" onclick="sendInstall(event)">Install Mastodon</button>
    <div>
      <button onclick="getAllJobs()">Get jobs</button>
      <div id="jobs"></div>
    </div>
    <div>
      <button onclick="getAllInstances()">Get instances</button>
      <div id="instances"></div>
    </div>
    <div></div>
    <div>
      <label>Job ID</label>
      <input id="job_id" type="text">
      <button onClick="checkJobStatus(document.getElementByID('job_id').value)">Check status</button>
      <div id="job_result"></div>
    </div>
  </div>
  <pre id="job_log"></pre>
  <pre id="result"></pre>
</body>
</html>
