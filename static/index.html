<html>
	<head>
        <link rel="stylesheet" href="/index.css"/>
	</head>
	<body>
        <template id="template-target">
            <div>
                <h3>Target #{{ID}}</h3>
                <div>{{User}}@{{Host}}:{{Port}}</div>
                <div>Domain: {{Domain}}</div>
                <div>Run by: {{ContainerBackend}}</div>
            </div>
        </template>
        <div class="page-wrapper">
            <div>
                <h2>This does not work</h2>
                <button class="deployment_targets_add">Add a deployment target</button>

                <div>
                    <h2>Install to a VPS</h2>
                    <form class="form-create-vps" action="/target/create" method="POST">
                        <div>
                            <label for="host">Host</label>
                            <input name="host" type="text" value="172.232.204.97" />
                            <label for="port">Port</label>
                            <input name="port" type="number" value="22"/>
                        </div>
                        <div>
                            <label for="username">User on this machine</label>
                            <input name="username" type="text" value="dcomms" />
                        </div>

                        <div>
                            <label for="domainname">Domain name you've registered</label>
                            <input name="domainname" type="text" value="dcomms1.letmeaskyou.live"/>
                        </div>

                        <div>
                            <label for="matrix_on">Install Matrix</label>
                            <input name="matrix_on" type="checkbox" />
                            <label for="mau_on">Install Mau</label>
                            <input name="mau_on" type="checkbox" />
                            <label for="ceno_on">Install Ceno bridge</label>
                            <input name="ceno_on" type="checkbox" />
                            <label for="mastodon_on">Install Mastodon</label>
                            <input name="mastodon_on" type="checkbox" />
                            <label for="peertube_on">Install Peertube</label>
                            <input name="peertube_on" type="checkbox" />
                        </div>

                        <button type="submit">Install</button>
                        <button>Test connection</button>
                    </form>
                </div>

                <hr/>

                <h2>This works</h2>

                <div class="deployment_targets_list">

                </div>

            </div>
        </div>
        <script type="module" src="/index.js"></script>
	</body>
</html>
