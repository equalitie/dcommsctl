<html>
	<head>

        <link rel="stylesheet" href="/index.css"/>

	</head>

	<body>

        <div class="page-wrapper">
            <div class="left-side">
                <div class="services-list">
                    <h2>Running services</h2>
                    <div class="border-gradient border-gradient-purple">
                        <div class="service" data-id="peertube">
                            <b class="service-title">Peertube</b>
                            <button class="service-start" data-id="peertube">Start</button>
                            <button class="service-stop" data-id="peertube">Stop</button>
                            <button class="config-load-btn" data-id="peertube">Edit env file</button>
                            <button class="env-load-btn" data-id="peertube">Get env</button>
                            <span class="service-status-wrapper">
                                <span class="service-off"></span>
                            </span>
                        </div>
                    </div>

                    <div class="border-gradient border-gradient-purple">
                        <div class="service" data-id="mastodon">
                            <b class="service-title">Mastodon</b>
                            <button class="service-start" data-id="mastodon">Start</button>
                            <button class="service-stop" data-id="mastodon">Stop</button>
                            <button class="config-load-btn" data-id="mastodon">Edit env file</button>
                            <button class="env-load-btn" data-id="mastodon">Get env</button>
                            <span class="service-status-wrapper">
                                <span class="service-off"></span>
                            </span>
                        </div>
                    </div>

                    <div class="border-gradient border-gradient-purple">
                        <div class="service" data-id="synapse">
                            <b class="service-title">Synapse</b>
                            <button class="service-start" data-id="synapse">Start</button>
                            <button class="service-stop" data-id="synapse">Stop</button>
                            <button class="config-load-btn" data-id="synapse">Edit env file</button>
                            <button class="env-load-btn" data-id="synapse">Get env</button>
                            <span class="service-status-wrapper">
                                <span class="service-off"></span>
                            </span>
                        </div>
                    </div>

                </div>

                <h2>Word processor</h2>
                <button class="config-save-btn">Save</button>
                <div class="border-gradient border-gradient-pink">
                    <textarea id="editor-area" placeholder="This is where you gonna fix things with files..."></textarea>
                </div>
            </div>
            <div class="right-side">
                <div style="text-align: right">
                    <button class="panic-btn">PANIC</button>
                </div>
                <h2>Host info</h2>
                <div class="border-gradient border-gradient-green">
                    <div id="host-info"></div>

                    <div>
                        <h2>Install to a VPS</h2>
                        <form class="form-install-vps" action="/install" method="POST">
                            <div>
                                <label for="host">Host</label>
                                <input name="host" type="text" value="172.232.204.97" />
                            </div>
                            <div>
                                <label for="port">Port</label>
                                <input name="port" type="number" value="22"/>
                            </div>
                            <div>
                                <label for="username">User on this machine</label>
                                <input name="username" type="text" value="dcomms" />
                            </div>

                            <div>
                                <label for="domainname">Domain name you've registered</label>
                                <input name="domainname" type="text" />
                            </div>
                            <div>
                                <label for="matrix-on">Install Matrix</label>
                                <input name="matrix-on" type="checkbox" />
                            </div>
                            <button type="submit">Install</button>
                            <button>Test connection</button>
                        </form>
                    </div>
                </div>

                <h2>Environment variables</h2>
                <div class="border-gradient border-gradient-green">
                    <div id="env-info">Click "Get env" on a container</div>
                </div>
            </div>
        </div>

        <div id="main-log">

        </div>


        <script type="module" src="/index.js"></script>

	</body>
</html>
